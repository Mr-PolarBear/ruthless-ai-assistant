<!-- sidebar.html：仅包含aside.sidebar内容 -->
<aside class="sidebar">
    <div class="sidebar-header">
        <button id="sidebar-close-btn" class="sidebar-close-btn" title="关闭侧边栏">
            <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none"
                 stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <line x1="18" y1="6" x2="6" y2="18"></line>
                <line x1="6" y1="6" x2="18" y2="18"></line>
            </svg>
        </button>
        <h1>智能摸鱼 v260813</h1>
        <div class="sidebar-actions">
            <button id="hide-summary-btn" title="隐藏与总结" style="position: relative;">
                <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none"
                     stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
                    <circle cx="12" cy="12" r="3"></circle>
                </svg>
                <span id="hide-summary-limit-badge" class="hide-summary-limit-badge"></span>
            </button>
            <button id="settings-btn" title="设置">
                <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none"
                     stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <circle cx="12" cy="12" r="3"></circle>
                    <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"></path>
                </svg>
            </button>
        </div>
    </div>
    <div class="sidebar-content">
        <button id="new-chat-btn">
            <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none"
                 stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <circle cx="12" cy="12" r="10"></circle>
                <line x1="12" y1="8" x2="12" y2="16"></line>
                <line x1="8" y1="12" x2="16" y2="12"></line>
            </svg>
            新的对话
        </button>
        <div class="history-search-wrapper" style="display: flex; gap: 6px; align-items: center;">
            <input type="search" id="history-search-input" name="sidebar-title-search-no-fill" 
                   placeholder="搜索会话标题..." autocomplete="chrome-off" 
                   data-lpignore="true" data-form-type="other" data-1p-ignore="true" aria-autocomplete="none"
                   readonly onfocus="this.removeAttribute('readonly')" style="flex: 1;">
            <button id="content-search-btn" class="content-search-trigger-btn" title="全文内容搜索（支持多分支与高亮定位）">
                <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="vertical-align: -2px; margin-right: 2px;"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>内容搜索
            </button>
        </div>
        <!-- 乌鸦：会话历史列表视图切换标签 -->
        <div class="history-view-tabs">
            <button id="history-view-simple" class="history-view-tab active" data-view="simple" title="简洁列表">
                <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="8" y1="6" x2="21" y2="6"/><line x1="8" y1="12" x2="21" y2="12"/><line x1="8" y1="18" x2="21" y2="18"/><line x1="3" y1="6" x2="3.01" y2="6"/><line x1="3" y1="12" x2="3.01" y2="12"/><line x1="3" y1="18" x2="3.01" y2="18"/></svg>
            </button>
            <button id="history-view-grouped" class="history-view-tab" data-view="grouped" title="时间分组">
                <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="18" rx="2" ry="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>
            </button>
            <button id="batch-delete-btn" class="history-view-tab" title="批量删除">
                <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="3 6 5 6 21 6"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/><line x1="10" y1="11" x2="10" y2="17"/><line x1="14" y1="11" x2="14" y2="17"/></svg>
            </button>
        </div>
        <!-- 乌鸦：批量操作工具栏 -->
        <div id="batch-actions-bar" class="batch-actions-bar" style="display: none;">
            <label class="batch-select-all">
                <input type="checkbox" id="batch-select-all-checkbox">
                <span>全选</span>
            </label>
            <span id="batch-selected-count" class="batch-selected-count">已选 0 项</span>
            <div class="batch-actions-buttons">
                <button id="batch-delete-confirm" class="batch-action-btn delete" disabled>删除选中</button>
                <button id="batch-cancel-btn" class="batch-action-btn cancel">取消</button>
            </div>
        </div>
        <!-- 备份健康度提醒横幅容器 -->
        <div id="backup-reminder-container" class="backup-reminder-container" style="display: none;"></div>

        <!-- 乌鸦：简洁列表（原有）-->
        <div id="history-list" class="history-list-view simple-view"></div>
        <!-- 乌鸦：时间分组列表（新）-->
        <div id="history-grouped-list" class="history-list-view grouped-view" style="display: none;"></div>
    </div>
    <div class="sidebar-footer">
        <span id="conversation-count" class="conversation-count">共 0 个会话</span>
    </div>
</aside>
