<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>智能摸鱼 (v260813)</title>
    <link rel="icon" href="favorite.ico" type="image/x-icon">

    <!-- External Libraries -->

    <link rel="stylesheet" href="css/chat.css?v=260813">
    <link rel="stylesheet" href="css/modals.css?v=260813">

    <link rel="stylesheet" href="css/tools-menu.css?v=260813">

</head>

<body data-theme="light">
    <div id="app">
        <!-- Sidebar Toggle Button -->
        <button id="sidebar-toggle-btn" title="收起/展开侧边栏">
            <svg xmlns="http://www.w3.org/2000/svg" width="28" height="28" viewBox="0 0 24 24" fill="none"
                stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <line x1="4" y1="6" x2="20" y2="6" />
                <line x1="4" y1="12" x2="20" y2="12" />
                <line x1="4" y1="18" x2="20" y2="18" />
            </svg>
        </button>

        <!-- 移动端侧边栏真实遮罩层 -->
        <div id="sidebar-backdrop" class="sidebar-backdrop"></div>

        <!-- Sidebar (动态加载) -->
        <div id="sidebar-placeholder"></div>
        <button id="exit-fullscreen-btn" title="退出全屏" class="hidden fullscreen-btn-top-right">
            <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none"
                stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <polyline points="4 14 4 20 10 20"></polyline>
                <polyline points="20 10 20 4 14 4"></polyline>
                <line x1="14" y1="10" x2="21" y2="3"></line>
                <line x1="3" y1="21" x2="10" y2="14"></line>
            </svg>
        </button>

        <!-- Main Chat Area -->
        <main class="main-chat">
            <!-- 乌鸦：文件拖拽上传全视口遮罩 Drop Zone -->
            <div id="chat-drop-zone" class="chat-drop-zone hidden">
                <div class="drop-zone-content">
                    <div class="drop-zone-icon-wrap">
                        <svg xmlns="http://www.w3.org/2000/svg" width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" class="drop-zone-icon">
                            <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path>
                            <polyline points="17 8 12 3 7 8"></polyline>
                            <line x1="12" y1="3" x2="12" y2="15"></line>
                        </svg>
                    </div>
                    <div class="drop-zone-title">释放文件以添加为附件</div>
                    <div class="drop-zone-subtitle">支持图片、文本/代码、Word、PDF、Excel、PPT 等格式</div>
                </div>
            </div>
            <div id="global-loading-overlay" class="loading-overlay hidden">
                <div class="spinner"></div>
            </div>
            <div id="persona-bar" class="persona-bar">
                <!-- 乌鸦：更新日志按钮，放在角色选择器左边 -->
                <button id="changelog-btn" title="更新日志">
                    <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none"
                        stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M16 4h2a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h2"></path>
                        <rect x="8" y="2" width="8" height="4" rx="1" ry="1"></rect>
                        <line x1="12" y1="11" x2="12" y2="17"></line>
                        <line x1="9" y1="14" x2="15" y2="14"></line>
                    </svg>
                </button>
                <!-- 乌鸦：角色选框 + 角色管理按钮合并为一体 -->
                <div class="persona-combo">
                    <select id="persona-selector">
                        <option value="default">无角色 (默认)</option>
                    </select>
                    <button id="manage-personas-btn" title="管理角色"><svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"></circle><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"></path></svg></button>
                </div>
                <button id="manage-worldbook-btn" title="备忘录">
                    <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="vertical-align:-2px;"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"></path><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"></path></svg>
                    <span class="btn-text">备忘录</span>
                </button>
                <!-- 乌鸦：分支导航器内嵌到 persona-bar，节省一行空间 -->
                <div id="branch-navigator" class="branch-navigator">
                    <button id="prev-branch-btn" title="上一个版本">
                        <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none"
                            stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <polyline points="15 18 9 12 15 6"></polyline>
                        </svg>
                    </button>
                    <span id="branch-indicator" class="branch-indicator-wrap">
                        <span class="branch-current">1</span>
                        <span class="branch-sep">/</span>
                        <span class="branch-total">1</span>
                    </span>
                    <button id="next-branch-btn" title="下一个版本">
                        <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none"
                            stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <polyline points="9 18 15 12 9 6"></polyline>
                        </svg>
                    </button>
                </div>
                <label for="theme-selector" style="display:none;">主题:</label>
                <select id="theme-selector" style="min-width:70px;margin-right:8px">
                    <option value="dark">深色</option>
                    <option value="light">浅色</option>
                    <option value="green">绿色</option>
                    <option value="gold">金色</option>
                    <option value="pink">粉色</option>
                    <option value="blue">蓝色</option>
                    <option value="purple">紫色</option>
                    <option value="orange">橙色</option>
                    <option value="gray">灰色</option>
                </select>
                <div style="display: flex; align-items: center; justify-content: flex-end; margin-bottom: 4px;">
                    <button id="chat-search-btn" title="搜索本会话消息"
                        style="display: flex; align-items: center; justify-content: center; padding: 4px; width: 28px; height: 28px; border-radius: var(--radius-full);">
                        <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none"
                            stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <circle cx="11" cy="11" r="8"></circle>
                            <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
                        </svg>
                    </button>
                    <div id="chat-search-box"
                        style="display: none; position: absolute; left: 50%; top: 110px; transform: translateX(-50%); z-index: 1000; background: rgb(255, 255, 255); border: 1px solid rgb(204, 204, 204); border-radius: 6px; box-shadow: rgba(0, 0, 0, 0.15) 0px 2px 8px; padding: 8px 12px; align-items: center; gap: 8px; min-width: 320px;">
                        <input id="chat-search-input" type="search" placeholder="搜索本会话内容..."
                            style="padding: 4px 8px; border: 1px solid rgb(204, 204, 204); border-radius: 4px; outline: none; flex-grow: 1;"
                            autocomplete="off">
                        <button id="chat-search-prev"
                            style="background: none; border: none; cursor: pointer; display: none; padding: 0px 4px;">&lt;</button>
                        <span id="chat-search-counter"
                            style="font-size: 12px; color: rgb(102, 102, 102); display: none; white-space: nowrap;"></span>
                        <button id="chat-search-next"
                            style="background: none; border: none; cursor: pointer; display: none; padding: 0px 4px;">&gt;</button>
                        <button id="chat-search-close" style="background: none; border: none; cursor: pointer;">
                            <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none"
                                stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                <line x1="18" y1="6" x2="6" y2="18"></line>
                                <line x1="6" y1="6" x2="18" y2="18"></line>
                            </svg>
                        </button>
                    </div>
                </div>
                <div class="system-prompt-btn-wrapper" style="display: inline-flex; align-items: center; gap: 6px;">
                    <button id="system-prompt-btn" title="查看会话数据详情">
                        <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none"
                            stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <circle cx="12" cy="12" r="10"></circle>
                            <line x1="12" y1="16" x2="12" y2="12"></line>
                            <line x1="12" y1="8" x2="12.01" y2="8"></line>
                        </svg>
                    </button>
                    <span id="session-token-badge" class="session-token-badge" title="当前会话总预估Token数">0 Tokens</span>
                </div>
                <button id="fullscreen-btn" title="全屏聊天界面">
                    <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none"
                        stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <polyline points="15 3 21 3 21 9"></polyline>
                        <polyline points="9 21 3 21 3 15"></polyline>
                        <line x1="21" y1="3" x2="14" y2="10"></line>
                        <line x1="3" y1="21" x2="10" y2="14"></line>
                    </svg>
                </button>
                <button id="top-settings-btn" title="系统设置中心">
                    <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none"
                        stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <circle cx="12" cy="12" r="3"></circle>
                        <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"></path>
                    </svg>
                </button>
            </div>

            <div id="load-all-messages-btn" style="display:none;">
                <button class="load-all-pill-btn">
                    <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="vertical-align:-2px;margin-right:5px;"><line x1="8" y1="6" x2="21" y2="6"></line><line x1="8" y1="12" x2="21" y2="12"></line><line x1="8" y1="18" x2="21" y2="18"></line><line x1="3" y1="6" x2="3.01" y2="6"></line><line x1="3" y1="12" x2="3.01" y2="12"></line><line x1="3" y1="18" x2="3.01" y2="18"></line></svg>
                    加载全部消息
                </button>
            </div>
            <div id="chat-messages"></div>
            <div class="scroll-nav-buttons">
                <!-- 乌鸦：楼层快速跳转按钮，移至顶部滚动按钮上方 -->
                <button id="jump-to-floor-btn" title="快速跳转到指定楼层">
                    <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none"
                        stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <polygon points="12 2 2 7 12 12 22 7 12 2"></polygon>
                        <polyline points="2 17 12 22 22 17"></polyline>
                        <polyline points="2 12 12 17 22 12"></polyline>
                    </svg>
                </button>
                <button id="scroll-to-top-btn" title="滚动到顶部" class="hidden">
                    <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none"
                        stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <polyline points="18 15 12 9 6 15"></polyline>
                    </svg>
                </button>
                <button id="scroll-to-bottom-btn" title="滚动到底部" class="hidden">
                    <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none"
                        stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <polyline points="6 9 12 15 18 9"></polyline>
                    </svg>
                </button>
            </div>
            <!-- 乌鸦：楼层快速跳转浮动面板 -->
            <div id="floor-jump-panel" class="floor-jump-panel">
                <div class="floor-jump-header">
                    <span><svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="vertical-align:-2px;margin-right:4px;"><line x1="8" y1="6" x2="21" y2="6"></line><line x1="8" y1="12" x2="21" y2="12"></line><line x1="8" y1="18" x2="21" y2="18"></line><line x1="3" y1="6" x2="3.01" y2="6"></line><line x1="3" y1="12" x2="3.01" y2="12"></line><line x1="3" y1="18" x2="3.01" y2="18"></line></svg>快速跳转</span>
                </div>
                <div class="floor-jump-list"></div>
            </div>
            <div class="input-area">
                <div class="input-wrapper">
                    <div id="attachment-preview" class="attachment-preview"></div>
                    <div class="input-controls" id="input-controls-primary">
                        <select id="api-selector" class="api-selector"></select>
                        <input type="file" id="file-input"
                            accept=".txt,.xml,.js,.py,.html,.css,.json,.md,.csv,.java,.png,.jpg,.jpeg,.gif,.webp,.docx,.doc,.pdf,.xlsx,.xls,.et,.pptx,.wps" hidden
                            multiple>
                        <button id="choose-db-btn" class="input-area-btn" title="选择数据库">
                            <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" fill="none"
                                viewBox="0 0 18 18">
                                <rect x="2.5" y="4.5" width="13" height="9" rx="3.5" stroke="currentColor"
                                    stroke-width="1.2" />
                                <line x1="4.5" y1="7" x2="13.5" y2="7" stroke="currentColor" stroke-width="1.1" />
                                <line x1="4.5" y1="11" x2="13.5" y2="11" stroke="currentColor" stroke-width="1.1" />
                            </svg>
                        </button>
                        <button id="choose-table-btn" class="input-area-btn" title="选择数据库表">
                            <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" fill="none"
                                viewBox="0 0 18 18">
                                <rect x="2.5" y="4.5" width="13" height="9" rx="2" stroke="currentColor"
                                    stroke-width="1.2" />
                                <line x1="2.5" y1="7.5" x2="15.5" y2="7.5" stroke="currentColor" stroke-width="1.1" />
                                <line x1="2.5" y1="10.5" x2="15.5" y2="10.5" stroke="currentColor" stroke-width="1.1" />
                                <line x1="6.5" y1="4.5" x2="6.5" y2="13.5" stroke="currentColor" stroke-width="1.1" />
                                <line x1="11.5" y1="4.5" x2="11.5" y2="13.5" stroke="currentColor" stroke-width="1.1" />
                            </svg>
                        </button>
                        <button id="attachment-btn" class="input-area-btn" title="上传附件">
                            <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none"
                                stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                <path d="M21.44 11.05l-9.19 9.19a6 6 0 0 1-8.49-8.49l9.19-9.19a4 4 0 0 1 5.66 5.66l-9.2 9.19a2 2 0 0 1-2.83-2.83l8.49-8.48"></path>
                            </svg>
                        </button>
                        <div id="quick-prompt-wrapper">
                            <button id="quick-prompt-btn" class="input-area-btn" title="快捷提示">
                                <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none"
                                    stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                    <polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"></polygon>
                                </svg>
                            </button>
                        </div>
                        <div id="mcp-tools-wrapper">
                            <button id="mcp-tools-btn" class="input-area-btn" title="MCP工具选择">
                                <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none"
                                    stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                    <path d="M14.7 6.3a1 1 0 0 0 0 1.4l1.6 1.6a1 1 0 0 0 1.4 0l3.77-3.77a6 6 0 0 1-7.94 7.94l-6.91 6.91a2.12 2.12 0 0 1-3-3l6.91-6.91a6 6 0 0 1 7.94-7.94l-3.76 3.76z"></path>
                                </svg>
                                <span id="mcp-selected-count" class="badge" style="display: none;">0</span>
                            </button>
                        </div>
                        <textarea id="message-input" placeholder="输入消息... (Shift+Enter 换行)" rows="1"></textarea>
                        <button id="clear-input-btn" class="input-area-btn hidden" title="清空输入">
                            <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none"
                                stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                <line x1="18" y1="6" x2="6" y2="18"></line>
                                <line x1="6" y1="6" x2="18" y2="18"></line>
                            </svg>
                        </button>
                        <button id="send-button" title="发送">
                            <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none"
                                stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                <line x1="22" y1="2" x2="11" y2="13"></line>
                                <polygon points="22 2 15 22 11 13 2 9 22 2"></polygon>
                            </svg>
                        </button>
                    </div>
                    <div class="input-controls-secondary" id="input-controls-secondary"></div>
                </div>
            </div>
        </main>

        <!-- 乌鸦：代码预览侧边栏 -->
        <aside id="code-preview-sidebar" class="code-preview-sidebar">
            <!-- 乌鸦：拖拽手柄，用于调整侧边栏宽度 -->
            <div class="resize-handle" id="preview-resize-handle"></div>
            <div class="code-preview-header">
                <div style="display: flex; flex-direction: column; gap: 2px;">
                    <span class="preview-title">代码预览</span>
                    <span id="preview-status" class="preview-status"
                        style="font-size: 0.75em; color: var(--text-tertiary); font-weight: normal; opacity: 0; transition: opacity 0.3s;"></span>
                </div>
                <div class="header-actions" style="display: flex; gap: 8px; align-items: center;">
                    <button id="preview-scroll-top" class="header-scroll-btn" title="滚动到顶部">
                        <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none"
                            stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M18 15l-6-6-6 6" />
                        </svg>
                    </button>
                    <button id="preview-scroll-bottom" class="header-scroll-btn" title="滚动到底部">
                        <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none"
                            stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">

    <!-- Dynamic Content Loader -->
    <script type="module">
        // Import the necessary initialization functions from your JS files.
        import { initialize } from './js/main.js';

        async function loadApp() {
            try {
                // Step 1: Fetch the sidebar HTML
                const sidebarResp = await fetch('sidebar.html');
                if (sidebarResp.ok) {
                    const sidebarHTML = await sidebarResp.text();
                    document.getElementById('sidebar-placeholder').innerHTML = sidebarHTML;
                }

                // Step 2: Fetch the modals' HTML
                const response = await fetch('modals.html');
                if (!response.ok) {
                    throw new Error(`HTTP error! status: ${response.status}`);
                }
                const modalHTML = await response.text();

                // Step 3: Inject the HTML into the container
                document.getElementById('modal-container').innerHTML = modalHTML;

                // Step 4: Now that all DOM elements are present, run the main initialization script.
                initialize();

            } catch (error) {
                console.error("Failed to load app components:", error);
                document.body.innerHTML = '<p style="color: red; text-align: center; margin-top: 50px;">应用程序加载失败，请检查控制台获取更多信息。</p>';
            }
        }

        // Run the loader function when the DOM is ready
        document.addEventListener('DOMContentLoaded', loadApp);
    </script>
